# CEH Toolkit configuration -- edit to customize behaviour.
# This file is sourced by bash; keep it to simple KEY=value lines.

# ---- General ---------------------------------------------------------------
TOOLKIT_NAME="CEH Toolkit"
REPORT_DIR="reports"            # relative to toolkit root, or absolute path
COLOR=auto                      # auto | on | off
VERBOSE=0                       # 1 = extra debug output

# ---- Authorization gate ----------------------------------------------------
# Network-facing modules refuse to run unless the target appears in
# config/scope.txt (one host / IP / domain per line), OR the target is
# localhost. Set to 0 only if you fully understand the legal implications.
REQUIRE_SCOPE=1
SCOPE_FILE="config/scope.txt"

# ---- Port scanner ----------------------------------------------------------
SCAN_TIMEOUT=1                  # seconds per port connection attempt
SCAN_THREADS=100                # parallel connection attempts
TOP_PORTS="21,22,23,25,53,80,110,111,135,139,143,443,445,465,587,993,995,1433,1521,2049,3306,3389,5432,5900,6379,8000,8080,8443,9200,27017"

# ---- Web audit -------------------------------------------------------------
HTTP_TIMEOUT=8
USER_AGENT="CEH-Toolkit/1.0 (authorized security audit)"

# ---- DNS recon -------------------------------------------------------------
SUBDOMAIN_WORDLIST="wordlists/subdomains.txt"

# ---- Password audit --------------------------------------------------------
COMMON_PASSWORDS="wordlists/common-passwords.txt"
MIN_PASSWORD_LENGTH=12

# ---- Log analysis ----------------------------------------------------------
FAILED_LOGIN_THRESHOLD=5        # flag IPs with >= this many failures
